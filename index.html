<!DOCTYPE html>
<html>
<head>
  <title>Geometric Nightmare</title>
  <style>
    body { margin:0; overflow:hidden; background:black; }
    #overlay {
      position:absolute; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      color:white; font-family:sans-serif;
      background:black; cursor:pointer;
    }
  </style>
</head>
<body>

<div id="overlay">CLICK TO ENTER</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';
import { PointerLockControls } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/PointerLockControls.js';

let scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 5, 80);

let camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.y = 1;

let renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// CONTROLS
let controls = new PointerLockControls(camera, document.body);
document.getElementById("overlay").onclick = () => {
  controls.lock();
  document.getElementById("overlay").style.display = "none";
};
scene.add(controls.getObject());

// LIGHT
scene.add(new THREE.HemisphereLight(0xffffff, 0x222222));

// =======================
// GEOMETRY LAYER
// =======================

// Infinite grid
let grid = new THREE.GridHelper(1000, 200, 0xffffff, 0x444444);
scene.add(grid);

// floating objects
let objects = [];

function spawnObjects(count = 60) {
  for (let i = 0; i < count; i++) {

    let geoTypes = [
      new THREE.SphereGeometry(0.5, 8, 8),
      new THREE.BoxGeometry(1,1,1),
      new THREE.PlaneGeometry(2,2)
    ];

    let geo = geoTypes[Math.floor(Math.random()*geoTypes.length)];

    let mat = new THREE.MeshBasicMaterial({
      wireframe: true,
      color: 0xffffff
    });

    let mesh = new THREE.Mesh(geo, mat);

    mesh.position.set(
      (Math.random()-0.5)*50,
      (Math.random()-0.5)*20,
      -Math.random()*200
    );

    scene.add(mesh);
    objects.push(mesh);
  }
}

spawnObjects();

// =======================
// DOT / STATIC FIELD
// =======================

let particles = new THREE.BufferGeometry();
let positions = [];

for (let i = 0; i < 2000; i++) {
  positions.push(
    (Math.random()-0.5)*200,
    (Math.random()-0.5)*200,
    -Math.random()*400
  );
}

particles.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

let particleMat = new THREE.PointsMaterial({ size: 0.5 });
let pointField = new THREE.Points(particles, particleMat);
scene.add(pointField);

// =======================
// AUDIO LAYER
// =======================

let listener = new THREE.AudioListener();
camera.add(listener);

let hum = new THREE.Audio(listener);
let staticSound = new THREE.Audio(listener);

let audioLoader = new THREE.AudioLoader();

// low hum
audioLoader.load('https://cdn.pixabay.com/download/audio/2022/03/15/audio_5b4c1c9c63.mp3', buffer => {
  hum.setBuffer(buffer);
  hum.setLoop(true);
  hum.setVolume(0.2);
  hum.play();
});

// static noise
audioLoader.load('https://cdn.pixabay.com/download/audio/2022/03/10/audio_2b3c1df0a7.mp3', buffer => {
  staticSound.setBuffer(buffer);
  staticSound.setLoop(true);
  staticSound.setVolume(0.05);
  staticSound.play();
});

// =======================
// PERCEPTION SYSTEM
// =======================

let raycaster = new THREE.Raycaster();
let dread = 0;
let time = 0;

// =======================
// ANIMATION LOOP
// =======================

function animate() {
  requestAnimationFrame(animate);

  time += 0.01;
  dread += 0.0005;

  // =======================
  // MOTION LAYER
  // =======================

  controls.moveForward(0.06); // infinite pull

  let scale = Math.sin(time)*2 + 3;

  objects.forEach(o => {
    o.scale.set(scale, scale, scale);

    // slow rotation drift
    o.rotation.x += 0.002;
    o.rotation.y += 0.002;
  });

  // recursive duplication (light version)
  if (Math.random() < 0.01 && objects.length < 120) {
    spawnObjects(5);
  }

  // =======================
  // PERCEPTION LAYER
  // =======================

  raycaster.setFromCamera({x:0, y:0}, camera);
  let intersects = raycaster.intersectObjects(objects);

  objects.forEach(o => {
    if (intersects.length && intersects[0].object === o) {
      o.material.color.set(0xffffff);
    } else {
      o.material.color.set(0xff0000);

      // instability when not looked at
      o.position.x += (Math.random()-0.5)*0.05;
      o.position.y += (Math.random()-0.5)*0.05;
    }
  });

  // FOV distortion (distance lies)
  camera.fov = 75 + Math.sin(time)*10 + dread*20;
  camera.updateProjectionMatrix();

  // objects becoming background (depth illusion)
  pointField.position.z += 0.2;

  // =======================
  // SOUND REACTIVITY
  // =======================

  hum.setVolume(0.2 + dread);
  staticSound.setVolume(0.05 + Math.abs(Math.sin(time))*0.1);

  renderer.render(scene, camera);
}

animate();

// resize fix
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
