<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Geometric Nightmare</title>
  
  <!-- Very permissive CSP for GitHub Pages -->
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self' https: blob: data:;
                 script-src 'self' 'unsafe-eval' 'unsafe-inline' https: blob: data:;
                 script-src-elem 'self' 'unsafe-inline' https: blob: data:;
                 style-src 'self' 'unsafe-inline' https:;
                 style-src-elem 'self' 'unsafe-inline' https:;
                 img-src 'self' data: https:;
                 connect-src 'self' https:;">
  
  <style>
    body { margin:0; overflow:hidden; background:#000; }
    #overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.95);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-size: 2.8rem;
      cursor: pointer;
      z-index: 100;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="overlay">CLICK TO ENTER THE VOID</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';
    import { PointerLockControls } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/controls/PointerLockControls.js';

    console.log("%cScript loaded", "color:lime");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.Fog(0x000000, 10, 200);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.y = 2;

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(1);
    document.body.appendChild(renderer.domElement);

    const controls = new PointerLockControls(camera, document.body);
    scene.add(controls.getObject());

    const overlay = document.getElementById("overlay");

    overlay.addEventListener("click", () => {
      console.log("Click → locking pointer");
      controls.lock();
    });

    document.addEventListener("pointerlockchange", () => {
      if (document.pointerLockElement) {
        overlay.style.display = "none";
      } else {
        overlay.style.display = "flex";
      }
    });

    // Simple scene
    scene.add(new THREE.HemisphereLight(0xbbbbbb, 0x222222, 1.2));

    const grid = new THREE.GridHelper(500, 50, 0x00ff88, 0x003322);
    scene.add(grid);

    // Spawn some objects
    const objects = [];
    for (let i = 0; i < 40; i++) {
      const size = 1 + Math.random() * 3;
      const geo = Math.random() > 0.5 
        ? new THREE.BoxGeometry(size, size, size)
        : new THREE.SphereGeometry(size, 8, 8);
      
      const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
        color: 0xffffff,
        wireframe: true
      }));
      
      mesh.position.set(
        (Math.random()-0.5)*120,
        Math.random()*30 + 5,
        -Math.random()*300 - 50
      );
      scene.add(mesh);
      objects.push(mesh);
    }

    let time = 0;

    function animate() {
      requestAnimationFrame(animate);
      time += 0.016;

      controls.moveForward(0.12);

      objects.forEach((obj, i) => {
        obj.rotation.y = time * 0.8 + i;
        obj.position.y += Math.sin(time * 3 + i) * 0.03;
      });

      camera.fov = 75 + Math.sin(time * 2) * 12;
      camera.updateProjectionMatrix();

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    console.log("%cInitialization done - click the overlay", "color:cyan");
  </script>
</body>
</html>
