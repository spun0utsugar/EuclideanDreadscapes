<!DOCTYPE html>
<html>
<head>
  <title>Geometric Nightmare</title>
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self' https:; script-src 'self' 'unsafe-eval' https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; connect-src 'self' https:;">
  
  <style>
    body { margin:0; overflow:hidden; background:black; }
    #overlay {
      position:absolute; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      color:white; font-family:sans-serif; font-size:2.5rem;
      background:rgba(0,0,0,0.95); cursor:pointer; z-index:100;
      text-align:center;
    }
  </style>
</head>
<body>
<div id="overlay">CLICK TO ENTER THE VOID</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';
import { PointerLockControls } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/PointerLockControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x0a0a0a, 10, 150);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.y = 1.8;

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
document.body.appendChild(renderer.domElement);

const controls = new PointerLockControls(camera, document.body);
scene.add(controls.getObject());

const overlay = document.getElementById("overlay");

overlay.addEventListener("click", () => {
  controls.lock();
  overlay.style.display = "none";
});

document.addEventListener('pointerlockchange', () => {
  if (!document.pointerLockElement) overlay.style.display = "flex";
});

// Basic scene
scene.add(new THREE.HemisphereLight(0xaaaaaa, 0x222222, 1));

const grid = new THREE.GridHelper(2000, 100, 0x444444, 0x222222);
scene.add(grid);

const objects = [];
function spawnObjects(n = 60) {
  objects.forEach(o => scene.remove(o));
  objects.length = 0;
  for (let i = 0; i < n; i++) {
    const geo = Math.random() > 0.5 ? 
      new THREE.SphereGeometry(0.5 + Math.random() * 1.5, 8, 8) :
      new THREE.BoxGeometry(1 + Math.random() * 2, 1 + Math.random() * 2, 1 + Math.random() * 2);
    
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ wireframe: true, color: 0xffffff }));
    mesh.position.set((Math.random()-0.5)*100, Math.random()*40, -Math.random()*300 - 30);
    mesh.userData = { base: 1 + Math.random() * 2 };
    scene.add(mesh);
    objects.push(mesh);
  }
}
spawnObjects();

let time = 0, dread = 0, state = 0;

function animate() {
  requestAnimationFrame(animate);
  time += 0.016;
  dread = Math.min(dread + 0.00035, 1);

  if (Math.random() < 0.008) state = (state + 1) % 4;

  controls.moveForward(0.07 * (1 - dread * 0.65));

  objects.forEach((obj, i) => {
    let s = obj.userData.base;
    if (state === 1) s *= 2.5 + Math.sin(time * 5 + i) * 1.5;
    if (state === 3) s *= 0.4;
    
    obj.scale.setScalar(THREE.MathUtils.lerp(obj.scale.x, s, 0.1));
    obj.rotation.y += 0.004 + dread * 0.01;
  });

  camera.fov = 75 + Math.sin(time * 1.8) * (10 + dread * 30);
  camera.updateProjectionMatrix();

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
