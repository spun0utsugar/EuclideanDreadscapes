<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Geometric Nightmare - Test</title>
  
  <!-- Strong CSP for GitHub Pages -->
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self' https:; 
                 script-src 'self' 'unsafe-eval' 'unsafe-inline' https: blob: data:; 
                 style-src 'self' 'unsafe-inline' https:; 
                 img-src 'self' data: https:;">

  <style>
    body { margin:0; overflow:hidden; background:#000; font-family:sans-serif; }
    #overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.95);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      cursor: pointer;
      z-index: 100;
    }
    #info {
      position: absolute; top: 10px; left: 10px; color: #0f0; font-size: 12px; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="overlay">CLICK TO ENTER</div>
  <div id="info">Loading...</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';
    import { PointerLockControls } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/controls/PointerLockControls.js';

    console.log("Script started");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(1);
    document.body.appendChild(renderer.domElement);

    const controls = new PointerLockControls(camera, document.body);

    const overlay = document.getElementById("overlay");
    const info = document.getElementById("info");

    overlay.addEventListener("click", () => {
      console.log("Overlay clicked - trying to lock");
      controls.lock();
    });

    document.addEventListener("pointerlockchange", () => {
      if (document.pointerLockElement) {
        overlay.style.display = "none";
        info.textContent = "LOCKED - Move mouse | WASD = move";
      } else {
        overlay.style.display = "flex";
        info.textContent = "ESC pressed - click to re-enter";
      }
    });

    // Simple test scene
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));
    const grid = new THREE.GridHelper(100, 20, 0x00ff00, 0x003300);
    scene.add(grid);

    const box = new THREE.Mesh(
      new THREE.BoxGeometry(2,2,2),
      new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true })
    );
    scene.add(box);

    function animate() {
      requestAnimationFrame(animate);
      box.rotation.y += 0.005;
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    info.textContent = "Ready - click to start";
    console.log("Initialization complete");
  </script>
</body>
</html>
