<!DOCTYPE html>
<html>
<head>
  <title>Geometric Nightmare</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
  </style>
</head>
<body>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';
import { PointerLockControls } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/PointerLockControls.js';

let scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 5, 60);

let camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

let renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// controls
let controls = new PointerLockControls(camera, document.body);
document.body.addEventListener('click', () => controls.lock());
scene.add(controls.getObject());

// light
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444));

// nightmare objects
let objects = [];

for (let i = 0; i < 40; i++) {
  let mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 8, 8),
    new THREE.MeshBasicMaterial({ wireframe: true })
  );

  mesh.position.set(
    (Math.random()-0.5)*20,
    (Math.random()-0.5)*20,
    -Math.random()*100
  );

  scene.add(mesh);
  objects.push(mesh);
}

// animation
let t = 0;

function animate() {
  requestAnimationFrame(animate);
  t += 0.02;

  let scale = Math.sin(t)*2 + 3;

  objects.forEach(o => {
    o.scale.set(scale, scale, scale);
  });

  controls.moveForward(0.05);

  renderer.render(scene, camera);
}

animate();
</script>

</body>
</html>
